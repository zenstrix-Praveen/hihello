services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - digital_card_postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - digital_card_redis_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host postgres}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?Set PAYMENT_PROVIDER=razorpay}
      RAZORPAY_MODE: test
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [app-internal, app-egress]

  frontend:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set public API URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set public application URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_SERVER_URL: http://backend:8080/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend: { condition: service_healthy }
    networks: [app-internal]

volumes:
  digital_card_postgres_prod:
  digital_card_redis_prod:

networks:
  app-internal:
    driver: bridge
    internal: true
  app-egress:
    driver: bridge
