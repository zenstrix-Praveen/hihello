services:
  postgres:
    image: postgres:17
    container_name: digital-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_card
      POSTGRES_USER: digital_card
      POSTGRES_PASSWORD: digital_card_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - digital_card_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: digital-card-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - digital_card_redis_data:/data

volumes:
  digital_card_postgres_data:
  digital_card_redis_data:
